name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Static binaries: no libc or dynamic loader surprises on the target.
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="dsh-remote_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"

          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o dist/dsh-remote ./cmd/dsh-remote

          cp LICENSE README.md dist/
          tar -C dist -czf "${name}.tar.gz" .
          rm -rf dist

          echo "--- ${name}.tar.gz ---"
          tar -tzf "${name}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-remote_${{ matrix.goos }}_${{ matrix.goarch }}
          path: "*.tar.gz"
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "gh $(gh --version | head -n1)"

          if gh release create "${GITHUB_REF_NAME}" \
               --title "${GITHUB_REF_NAME}" \
               --generate-notes \
               dist/*.tar.gz dist/checksums.txt 2>gh.err; then
            echo "release published"
            exit 0
          fi

          err="$(cat gh.err)"
          echo "gh release create failed:"
          printf '%s\n' "$err"

          # Surface the error as a check annotation: those stay readable
          # without repository write access, unlike the job logs.
          msg="$(python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' <<<"$err")"
          echo "::error title=gh release create failed::${msg}"
          exit 1
